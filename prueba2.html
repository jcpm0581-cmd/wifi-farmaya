<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Externo Cloudflare</title>
    <script>
        // Truco para capturar la IP del AP que Aruba envía en la URL original
        function getQueryParam(param) {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        window.onload = function() {
            // Aruba envía el destino de autenticación en el parámetro 'cmdurl' (ej: http://192.168.1)
            var actionUrl = getQueryParam('cmdurl');
            if (actionUrl) {
                document.getElementById('arubaForm').action = decodeURIComponent(actionUrl);
            }
        }
    </script>
</head>
<body>

    <h1>Bienvenido a nuestra red</h1>
    <p>Acepta los términos para continuar.</p>

    <!-- El action se llena dinámicamente con JavaScript apuntando al AP -->
    <form id="arubaForm" method="POST" action="">
        <!-- Valores fijos que engañan al AP para que abra el acceso directo -->
        <input type="hidden" name="user" value="guest">
        <input type="hidden" name="password" value="guest">
        <input type="hidden" name="cmd" value="authenticate">
        
        <button type="submit">Aceptar y Conectar</button>
    </form>

</body>
</html>
