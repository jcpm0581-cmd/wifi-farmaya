<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script>

function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

window.onload = function() {

    const switchip = getParam("switchip");

    console.log("switchip:", switchip);

    const loginUrl = "https://" + switchip + "/cgi-bin/login";

    document.getElementById("arubaForm").action = loginUrl;

    console.log("action:", loginUrl);

};

</script>

</head>

<body>

<form id="arubaForm" method="POST">

<input type="hidden" name="cmd" value="authenticate">
<input type="hidden" name="user" value="guest">
<input type="hidden" name="password" value="guest">

<button type="submit">
Aceptar
</button>

</form>

</body>
</html>
