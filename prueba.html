<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Cautivo - Farmaya</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .terms { height: 110px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; text-align: left; margin-bottom: 20px; font-size: 12px; color: #555; }
        .checkbox-container { text-align: left; margin-bottom: 20px; font-size: 14px; }
        button { background-color: #ff6b00; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        button:hover:navigator { background-color: #e56000; }
    </style>
</head>
<body>

<div class="container">
    <h2>Conexión a la Red Wi-Fi</h2>
    <p>Para ingresar al servicio de internet, por favor acepte los términos de uso.</p>
    
    <div class="terms">
        Al presionar el botón de abajo, usted acepta cumplir con las políticas de navegación y seguridad establecidas para esta red inalámbrica.
    </div>

    <!-- Casilla de verificación obligatoria para forzar la interacción del usuario -->
    <div class="checkbox-container">
        <input type="checkbox" id="accept-terms" onchange="toggleButton()">
        <label for="accept-terms">He leído y acepto los términos y condiciones.</label>
    </div>

    <!-- Formulario limpio. Los valores críticos se inyectan solo al hacer clic -->
    <form id="authForm" method="POST" action="https://wifi-farmaya.farmayafarmacias.workers.dev">
        <input type="hidden" id="cmdParam" name="cmd" value="">
        <button type="button" id="submitBtn" onclick="submitAuthentication()" disabled>Conectarme a Internet</button>
    </form>
</div>

<script>
    // Habilita o deshabilita el botón según el checkbox
    function toggleButton() {
        const checkbox = document.getElementById('accept-terms');
        const button = document.getElementById('submitBtn');
        button.disabled = !checkbox.checked;
    }

    // Procesa el envío únicamente bajo la acción del usuario
    function submitAuthentication() {
        const checkbox = document.getElementById('accept-terms');
        
        if (checkbox.checked) {
            // Se asigna el valor requerido por Aruba justo antes de enviar
            document.getElementById('cmdParam').value = "authenticate";
            
            // Envío explícito del formulario
            document.getElementById('authForm').submit();
        } else {
            alert("Debe aceptar los términos y condiciones primero.");
        }
    }
</script>

</body>
</html>
