<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Cautivo - Farmaya</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .terms { height: 110px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; text-align: left; margin-bottom: 20px; font-size: 12px; color: #555; }
        button { background-color: #ff6b00; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background-color: #e56000; }
    </style>
</head>
<body>

<div class="container">
    <h2>Conexión a la Red Wi-Fi</h2>
    <p>Para ingresar al servicio de internet, por favor acepte los términos de uso.</p>
    
    <div class="terms">
        Al presionar el botón de abajo, usted acepta cumplir con las políticas de navegación y seguridad establecidas para esta red inalámbrica.
    </div>

    <!-- EL CAMBIO CRÍTICO: El action apunta a tu propio Worker, NO al Aruba. 
         Como el teléfono ya puede comunicarse con tu Worker, la petición NO se congelará. -->
    <form method="POST" action="https://workers.dev">
        
        <!-- El parámetro 'cmd' obligatorio para indicarle la acción al Aruba -->
        <input type="hidden" name="cmd" value="authenticate">

        <!-- El truco del "Authentication Text": 
             Al Aruba interceptar este POST saliente en el aire, leerá este valor 'user'.
             Si coincide con la palabra del AP, el firewall se abrirá mágicamente. -->
        <input type="hidden" name="user" id="aruba_text" value="">

        <button type="submit" onclick="setAuthText()">Aceptar y Conectar</button>
    </form>
</div>

<script>
    function setAuthText() {
        // IMPORTANTE: Escribe aquí la palabra clave exacta que configuraste en tu Aruba
        // Ejemplo: "AccesoPermitido123"
        document.getElementById('aruba_text').value = "AccesoPermitido123";
    }
</script>

</body>
</html>
