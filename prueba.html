<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Cautivo</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .terms { height: 100px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; text-align: left; margin-bottom: 20px; font-size: 12px; }
        button { background-color: #ff6b00; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #e56000; }
    </style>
</head>
<body>

<div class="container">
    <h2>Bienvenido a la red Wi-Fi</h2>
    <p>Acepte los términos para comenzar a navegar.</p>
    
    <div class="terms">
        Al presionar el botón de abajo, usted acepta los términos y condiciones de uso de esta red Wi-Fi.
    </div>

    <!-- El formulario inicia completamente VACÍO de credenciales -->
    <form id="arubaForm" method="POST" action="https://wifi-farmaya.farmayafarmacias.workers.dev/prueba">
        <input type="hidden" name="cmd" value="authenticate">
        <input type="hidden" name="url" value="https://google.com">
        
        <!-- Los campos críticos se generarán dinámicamente con JS -->
        <input type="hidden" name="user" id="aruba_user" value="">
        <input type="hidden" name="password" id="aruba_password" value="">

        <button type="submit">Aceptar y Conectar</button>
    </form>
</div>

<script>
    document.getElementById('arubaForm').addEventListener('submit', function(e) {
        // 1. Justo al hacer clic, inyectamos la palabra secreta en el HTML
        // IMPORTANTE: Pon aquí tu Auth Text exacto del Aruba
        const authSecret = "AccesoPermitido123"; 
        
        document.getElementById('aruba_user').value = authSecret;
        document.getElementById('aruba_password').value = authSecret;
        
        // 2. El formulario se envía inmediatamente después con los datos puestos
    });
</script>

</body>
</html>
